image: python:3.12-slim

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

update-dashboard:
  stage: build
  # Two runs regenerating and pushing the same three files at once is what a
  # `! [rejected] HEAD -> main (fetch first)` push looks like. Serialise them.
  resource_group: dashboard-sync
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - python generate_dashboard.py
    - git config user.name "Yusuf Eminoğlu"
    - git config user.email "geospacephilo@gmail.com"
    - git add plugins_history.json qgis_plugins_dashboard.html index.html
    - git diff --cached --quiet && echo "No changes to commit." && exit 0 || echo "Changes detected, committing."
    - 'git commit -m "chore(telemetry): scheduled sync of live QGIS metrics [skip ci]"'
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git pull --rebase origin "${CI_COMMIT_REF_NAME}"
    - git push origin HEAD:${CI_COMMIT_REF_NAME}
    - if [ -n "$GITHUB_PUSH_TOKEN" ]; then git remote add github "https://${GITHUB_PUSH_TOKEN}@github.com/YusufEminoglu/qgis-plugins-governance.git" || true; git push github HEAD:main; else echo "GITHUB_PUSH_TOKEN not set; skipping GitHub mirror push."; fi
  artifacts:
    paths:
      - index.html
      - qgis_plugins_dashboard.html
      - favicon.ico
      - assets
    expire_in: 1 hour

deploy-geophilo:
  stage: deploy
  image: node:20-slim
  script:
    - |
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "CLOUDFLARE_API_TOKEN not set; skipping Cloudflare Pages deploy."
        exit 0
      fi
      # Pages ignores .assetsignore: upload a folder holding only the page and its images,
      # never the repository (scripts, history, archive/).
      mkdir -p public
      cp index.html qgis_plugins_dashboard.html favicon.ico public/
      cp -r assets public/ && rm -rf public/assets/plugin_icons
      npx --yes wrangler pages deploy public --project-name geophilo-governance --branch main --commit-dirty=true

