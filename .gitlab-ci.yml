image: python:3.12-slim

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

update-dashboard:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - python generate_dashboard.py
    - git config user.name "Yusuf Eminoğlu"
    - git config user.email "geospacephilo@gmail.com"
    - git add plugins_history.json qgis_plugins_dashboard.html index.html
    - git diff --cached --quiet && echo "No changes to commit." && exit 0 || echo "Changes detected, committing."
    - 'git commit -m "chore(telemetry): scheduled sync of live QGIS metrics [skip ci]"'
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin HEAD:${CI_COMMIT_REF_NAME}
    - if [ -n "$GITHUB_PUSH_TOKEN" ]; then git remote add github "https://${GITHUB_PUSH_TOKEN}@github.com/YusufEminoglu/qgis-plugins-governance.git" || true; git push github HEAD:main; else echo "GITHUB_PUSH_TOKEN not set; skipping GitHub mirror push."; fi
