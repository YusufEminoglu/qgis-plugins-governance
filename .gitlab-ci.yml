image: python:3.12-slim

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

update-dashboard:
  stage: build
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - python generate_dashboard.py
    - git config user.name "Yusuf Eminoğlu"
    - git config user.email "geospacephilo@gmail.com"
    - git add plugins_history.json qgis_plugins_dashboard.html index.html
    - git diff --cached --quiet && echo "No changes to commit." && exit 0 || echo "Changes detected, committing."
    - 'git commit -m "chore(telemetry): scheduled sync of live QGIS metrics [skip ci]"'
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin HEAD:${CI_COMMIT_REF_NAME}
    - if [ -n "$GITHUB_PUSH_TOKEN" ]; then git remote add github "https://${GITHUB_PUSH_TOKEN}@github.com/YusufEminoglu/qgis-plugins-governance.git" || true; git push github HEAD:main; else echo "GITHUB_PUSH_TOKEN not set; skipping GitHub mirror push."; fi
  artifacts:
    paths:
      - qgis_plugins_dashboard.html
    expire_in: 1 hour

deploy-geophilo:
  stage: deploy
  image: node:20-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - |
      if [ -z "$GEOPHILO_PROJECT_PUSH_TOKEN" ]; then
        echo "GEOPHILO_PROJECT_PUSH_TOKEN not set; skipping geophilo.com publish."
        exit 0
      fi
      git clone --depth 1 "https://oauth2:${GEOPHILO_PROJECT_PUSH_TOKEN}@gitlab.com/yusufeminoglu/geophilo-project.git" geophilo_project
      cp qgis_plugins_dashboard.html geophilo_project/governance/index.html
      cd geophilo_project
      git config user.name "Yusuf Eminoğlu"
      git config user.email "geospacephilo@gmail.com"
      git add governance/index.html
      if git diff --cached --quiet; then
        echo "No governance changes to commit."
      else
        git commit -m "chore(governance): sync live QGIS dashboard [skip ci]"
      fi
      git push origin HEAD:main
      if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
        rm -rf .git .gitlab-ci.yml README.md .geophilo-managed-files.json
        npx --yes wrangler pages deploy . --project-name geophilo --branch main
      else
        echo "CLOUDFLARE_API_TOKEN not set; skipping Cloudflare Pages deploy."
      fi
